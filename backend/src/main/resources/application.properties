spring.application.name=salestorm
server.port=8080

# Database Configuration (PostgreSQL 18 on localhost:5432)
spring.datasource.url=jdbc:postgresql://localhost:5432/salestorm
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Configuration (Localhost 6379)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Kafka Configuration (Resilient: non-fatal if broker offline)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=salestorm-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.admin.auto-create=false
spring.kafka.admin.fail-fast=false
spring.kafka.listener.auto-startup=false

# Actuator & Management
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Flash Sale Configuration
salestorm.reservation.expiry-seconds=300
salestorm.jwt.secret=SaleStormSecretKey2026SysCraftersHighScaleFlashSaleSystemSuperSecureKey
salestorm.jwt.expiration-ms=86400000

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.paymentGateway.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentGateway.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.paymentGateway.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentGateway.wait-duration-in-open-state=5s
